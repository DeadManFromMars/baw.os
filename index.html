<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAWSOME ONLINE</title>

    <!-- Space Mono (readouts). The brand fonts load from /fonts/ in base.css. -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

    <!-- base.css first (fonts, colour tokens); scan.css before arg.css (the prompts
         reuse its --scan-* layout). One file per part of the site otherwise. -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/background.css">
    <link rel="stylesheet" href="css/scan.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/arg.css">
    <link rel="stylesheet" href="css/inventory.css">
    <link rel="stylesheet" href="css/cardeditor.css">
    <link rel="stylesheet" href="css/music.css">
    <link rel="stylesheet" href="css/signal.css">
</head>
<body>

    <!-- ─────────────────────────────────────────────────────────
         MUSIC — <audio> + radio widget, driven by js/music.js.
         Buttons use data-radio="…" (wired in music.js).
         The widget fades in once playback starts.
    ───────────────────────────────────────────────────────────── -->
    <audio id="bgMusic"></audio>

    <div id="radioWidget" role="region" aria-label="Music player">
        <div id="radioDragHandle" title="Drag to move"></div>
        <div class="radio-inner">
            <div class="radio-now">
                <!-- CD: spins while playing, cover art as the centre label -->
                <div class="cd radio-disc" aria-hidden="true"><div class="cd-spin"><div class="cd-label" id="radioArt"></div></div></div>
                <div class="radio-meta">
                    <div class="radio-kicker">Now playing</div>
                    <div class="radio-marquee-wrap">
                        <div class="radio-marquee" id="radioTitle"></div>
                    </div>
                    <div class="radio-artist" id="radioArtist"></div>
                </div>
            </div>
            <div>
                <div class="radio-progress-bar" id="radioProgress" title="Click to seek">
                    <div class="radio-progress-fill" id="radioFill"></div>
                </div>
                <div class="radio-times">
                    <span id="radioCurrent">0:00</span>
                    <span id="radioDuration">0:00</span>
                </div>
            </div>
            <div class="radio-deck">
                <div class="radio-controls">
                    <button type="button" class="radio-btn" data-radio="prev" aria-label="Previous track">&#9664;&#9664;</button>
                    <button type="button" class="radio-btn radio-play" data-radio="play" id="radioPlayBtn" aria-label="Play">&#9654;</button>
                    <button type="button" class="radio-btn" data-radio="next" aria-label="Next track">&#9654;&#9654;</button>
                </div>
                <label class="radio-volume-wrap">
                    <span class="radio-vol-label">Vol</span>
                    <input type="range" class="radio-volume" id="radioVolume" min="0" max="100" value="30">
                </label>
            </div>
            <button type="button" class="radio-mixtape-btn" data-radio="mixtape">Mixtape manager</button>
        </div>
    </div>

    <!-- Signal viewer button — bottom centre of globe screen -->
    <button id="signalBtn" data-sfx="hover" data-action="signal">SIGNAL VIEWER</button>


    <!-- ─────────────────────────────────────────────────────────
         BACKGROUND — decorative only (background.css). The dots are
         drawn by globe.js; the VHS overlay dims the scan's freeze.
    ───────────────────────────────────────────────────────────── -->
    <canvas id="dotCanvas"></canvas>
    <div class="haze"></div>
    <div class="vhs-overlay" id="vhsOverlay"></div>
    <div class="geo-top"></div>
    <div class="geo-left"></div>
    <div class="geo-corner"></div>

    <!-- Corner SVG accent brackets — lines animate like pistons -->
    <svg class="corner-accent corner-tl" viewBox="0 0 180 180" fill="none">
        <line x1="0"   y1="120" x2="0"   y2="40" />
        <line x1="0"   y1="40"  x2="80"  y2="40" />
        <line x1="24"  y1="80"  x2="24"  y2="16" />
        <line x1="24"  y1="16"  x2="100" y2="16" />
    </svg>
    <svg class="corner-accent corner-tr" viewBox="0 0 220 220" fill="none">
        <line x1="220" y1="0"   x2="60"  y2="160" />
        <line x1="220" y1="40"  x2="100" y2="160" />
        <line x1="170" y1="0"   x2="40"  y2="130" />
        <line x1="190" y1="0"   x2="220" y2="0"   />
        <line x1="190" y1="0"   x2="190" y2="50"  />
    </svg>
    <svg class="corner-accent corner-bl" viewBox="0 0 160 160" fill="none">
        <line x1="0"   y1="30"  x2="0"   y2="120" />
        <line x1="0"   y1="120" x2="80"  y2="120" />
        <line x1="26"  y1="80"  x2="26"  y2="144" />
        <line x1="26"  y1="144" x2="110" y2="144" />
    </svg>
    <svg class="corner-accent corner-br" viewBox="0 0 160 160" fill="none">
        <line x1="160" y1="30"  x2="160" y2="120" />
        <line x1="80"  y1="120" x2="160" y2="120" />
        <line x1="134" y1="80"  x2="134" y2="144" />
        <line x1="50"  y1="144" x2="134" y2="144" />
    </svg>

    <!-- Thin horizontal lines that drift across the screen -->
    <div class="scroll-line sl-1"></div>
    <div class="scroll-line sl-2"></div>
    <div class="scroll-line sl-3"></div>
    <div class="scroll-line sl-4"></div>
    <div class="scroll-line sl-5"></div>


    <!-- TERMINAL BAR — slides up during the scan's scripted part (scan.js adds .visible) -->
    <div id="termBar">
        <span class="term-prompt">root@bsi-node-7 ~$</span>
        <span class="term-line" id="termLine">
            <span class="term-cursor"></span>
        </span>
    </div>


    <!-- HANDS (scan.js): #handImg draws the message box, #handImgFlipped fixes the orphaned row -->
    <img id="handImg"        src="Images/hand.png" alt="">
    <img id="handImgFlipped" src="Images/hand.png" alt="">


    <!-- GLOBE (globe.js): dots on the canvas, pin lines + boxes in the SVG -->
    <canvas id="globeCanvas"></canvas>
    <svg id="globeOverlay"></svg>


    <!-- ─────────────────────────────────────────────────────────
         SCAN PHASE
         Hidden initially (display:none). Login.js reveals it
         after the secured flash plays. Laid out around the final
         welcome screen: wordmark top centre, globe centre, and two
         matching panels either side (sizes in scan.css).
           .scan-left   data readout + progress bar
           .scan-right  empty frame the hand draws #drawnBox into
    ───────────────────────────────────────────────────────────── -->
    <div id="scanPhase">

        <div class="scan-header">
            <div class="scan-wordmark">BAWSOME ONLINE</div>
            <div class="scan-tagline">Initializing Secure Session</div>
        </div>

        <section class="scan-panel scan-left" aria-label="Scan">
            <div class="scan-panel-head">
                <span>Subject scan</span>
                <span id="progressPct">0%</span>
            </div>
            <div class="scan-lines-wrap" id="scanLinesWrap">
                <div class="scan-lines" id="scanLines"></div>
            </div>
            <div class="scan-progress">
                <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
                <span id="progressLabel">Collecting data</span>
            </div>
        </section>

        <div class="scan-panel scan-right" id="scanRight"></div>

        <div id="drawnBox">
            <div class="tw-text" id="twText1"></div>
            <div class="tw-text" id="twText2"></div>
            <div class="tw-text tw-text-last" id="twText3"></div>
        </div>

    </div>


    <!-- SECURED FLASH — after the right passphrase (login.js) -->
    <div id="securedFlash">
        <div id="securedWord">SECURED</div>
        <svg id="securedRipples"></svg>
    </div>

    <!-- HEX CITY — first-visit intro (city.js); session.js shows it, it hides after login -->
    <canvas id="cityCanvas"></canvas>

    <!-- LOGIN — the passphrase, floating over the city (login.css) -->
    <div id="loginPhase">

        <div class="lp-hud-tl">
            BSI-NODE-7
        </div>

        <div class="lp-hud-br">
            <span id="sessionId">BSI-——</span>
        </div>

        <div class="lp-center">
            <div class="lp-label">PASSPHRASE</div>
            <div class="lp-input-wrap">
                <input
                    type="password"
                    id="password"
                    class="lp-input"
                    placeholder="—"
                    autocomplete="off"
                    spellcheck="false"
                >
            </div>
            <div class="lp-hint">ENTER TO AUTHENTICATE</div>
            <div class="msg" id="msg"></div>
        </div>

    </div>


    <!-- ─────────────────────────────────────────────────────────
         WELCOME VIEW — hidden until arg.js adds .visible.
         Buttons: data-action (arg.js), data-sfx="hover" (sounds.js).
    ───────────────────────────────────────────────────────────── -->
    <div id="argWelcome">WELCOME&nbsp;&nbsp;<span id="argWelcomeName"></span>!</div>
    <button id="argLogout"     data-sfx="hover" data-action="logout">LOGOUT</button>
    <button id="inventoryBtn"  data-sfx="hover" data-action="inventory">INVENTORY</button>
    <button id="cardEditorBtn" data-sfx="hover" data-action="card-editor">EDIT CARD</button>
    <!-- DEV: gives you every sticker. Shown only on localhost (arg.js); the backend allows it in DEBUG only. -->
    <button id="devStickerBtn" data-sfx="hover" data-action="dev-stickers">⬡ GET STICKERS</button>


    <!-- ─────────────────────────────────────────────────────────
         ARG CHOICE PROMPT
         Shown after the globe pin lines finish — before we know
         whether the visitor is new or returning. Two options:
           → Register a new identity
           → Offer a token (upload existing card)
    ───────────────────────────────────────────────────────────── -->
    <div id="argChoicePrompt">
        <div class="arg-minimal-inner">
            <button class="arg-minimal-btn arg-choice-btn" data-sfx="hover" data-action="choose-register">
                <span>register</span>
            </button>
            <div class="arg-choice-divider">—</div>
            <button class="arg-minimal-btn arg-choice-btn" data-sfx="hover" data-action="choose-card">
                <span>offer token</span>
            </button>
        </div>
    </div>


    <!-- ─────────────────────────────────────────────────────────
         ARG REGISTRATION PROMPT
         New visitors only. Appears after the dissolve sequence.
         Minimal: one input, one arrow button.
    ───────────────────────────────────────────────────────────── -->
    <div id="argRegPrompt">
        <div class="arg-minimal-inner">
            <input
                type="text"
                id="argUsername"
                class="arg-minimal-input"
                placeholder="—"
                autocomplete="off"
                spellcheck="false"
                maxlength="32"
            >
            <button class="arg-minimal-btn" id="argRegBtn" data-sfx="hover" data-action="register">
                <span id="argRegBtnText">→</span>
            </button>
            <div class="arg-minimal-msg" id="argRegMsg"></div>
            <div class="arg-minimal-sub" id="argRegSub">designate</div>
            <button class="arg-back-btn" data-sfx="hover" data-action="back">← back</button>
        </div>
    </div>


    <!-- ─────────────────────────────────────────────────────────
         CARD UPLOAD PROMPT
         Returning registered visitors. A card-reader slit UI.
         Clicking it opens the hidden file input.
         The "—" ghost button resets to registration if needed.
    ───────────────────────────────────────────────────────────── -->
    <div id="argCardPrompt">
        <div class="arg-minimal-inner">
            <div class="arg-card-slot" data-sfx="hover" data-action="pick-card" title="insert card">
                <!-- Decorative card diagram — mirrors the actual BAWSOME card template.
                     Vertical orientation, rounded corners, orange stripe at 1/3,
                     avatar box, subtle grid. Pure SVG, no data shown. -->
                <svg class="arg-card-diagram" viewBox="0 0 56 86" xmlns="http://www.w3.org/2000/svg">
                  <!-- Card body -->
                  <rect x="1" y="1" width="54" height="84" rx="5" ry="5"
                        fill="#aaff00" fill-opacity="0.45" stroke="var(--ink)" stroke-width="1" stroke-opacity="0.35"/>

                  <!-- Subtle grid on lime area (left of stripe) -->
                  <line x1="0"  y1="14" x2="56" y2="14" stroke="var(--ink)" stroke-width="0.3" stroke-opacity="0.08"/>
                  <line x1="0"  y1="28" x2="56" y2="28" stroke="var(--ink)" stroke-width="0.3" stroke-opacity="0.08"/>
                  <line x1="0"  y1="42" x2="56" y2="42" stroke="var(--ink)" stroke-width="0.3" stroke-opacity="0.08"/>
                  <line x1="0"  y1="56" x2="56" y2="56" stroke="var(--ink)" stroke-width="0.3" stroke-opacity="0.08"/>
                  <line x1="0"  y1="70" x2="56" y2="70" stroke="var(--ink)" stroke-width="0.3" stroke-opacity="0.08"/>
                  <line x1="14" y1="0"  x2="14" y2="86" stroke="var(--ink)" stroke-width="0.3" stroke-opacity="0.08"/>
                  <line x1="28" y1="0"  x2="28" y2="86" stroke="var(--ink)" stroke-width="0.3" stroke-opacity="0.08"/>
                  <line x1="42" y1="0"  x2="42" y2="86" stroke="var(--ink)" stroke-width="0.3" stroke-opacity="0.08"/>

                  <!-- Orange stripe — vertical, ~1/3 from left, clipped to card -->
                  <clipPath id="card-clip">
                    <rect x="1" y="1" width="54" height="84" rx="5" ry="5"/>
                  </clipPath>
                  <rect x="10" y="0" width="15" height="86" fill="#ff8c00" fill-opacity="0.72" clip-path="url(#card-clip)"/>

                  <!-- Stripe left edge -->
                  <line x1="10" y1="1" x2="10" y2="85" stroke="var(--ink)" stroke-width="0.4" stroke-opacity="0.12"/>
                  <!-- Stripe right edge -->
                  <line x1="25" y1="1" x2="25" y2="85" stroke="var(--ink)" stroke-width="0.4" stroke-opacity="0.12"/>

                  <!-- Avatar box inside stripe -->
                  <rect x="12" y="8" width="11" height="11" rx="2"
                        fill="none" stroke="var(--ink)" stroke-width="0.7" stroke-opacity="0.3"/>

                  <!-- Top bar -->
                  <rect x="1" y="1" width="54" height="3" rx="0"
                        fill="var(--ink)" fill-opacity="0.1" clip-path="url(#card-clip)"/>

                  <!-- Bottom bar -->
                  <rect x="1" y="82" width="54" height="3" rx="0"
                        fill="var(--ink)" fill-opacity="0.1" clip-path="url(#card-clip)"/>

                  <!-- Content area lines (right of stripe — suggest text rows) -->
                  <line x1="29" y1="12" x2="51" y2="12" stroke="var(--ink)" stroke-width="1.2" stroke-opacity="0.18" stroke-linecap="round"/>
                  <line x1="29" y1="17" x2="45" y2="17" stroke="var(--ink)" stroke-width="0.8" stroke-opacity="0.1"  stroke-linecap="round"/>
                  <line x1="29" y1="26" x2="51" y2="26" stroke="var(--ink)" stroke-width="0.8" stroke-opacity="0.12" stroke-linecap="round"/>
                  <line x1="29" y1="30" x2="43" y2="30" stroke="var(--ink)" stroke-width="0.8" stroke-opacity="0.1"  stroke-linecap="round"/>
                  <line x1="29" y1="38" x2="47" y2="38" stroke="var(--ink)" stroke-width="0.8" stroke-opacity="0.1"  stroke-linecap="round"/>

                  <!-- Divider lines -->
                  <line x1="29" y1="22" x2="52" y2="22" stroke="var(--ink)" stroke-width="0.4" stroke-opacity="0.15"/>
                  <line x1="29" y1="34" x2="52" y2="34" stroke="var(--ink)" stroke-width="0.4" stroke-opacity="0.15"/>

                  <!-- Barcode area at bottom -->
                  <rect x="29" y="68" width="4"  height="10" rx="0.5" fill="var(--ink)" fill-opacity="0.18"/>
                  <rect x="34" y="68" width="2"  height="10" rx="0.5" fill="var(--ink)" fill-opacity="0.12"/>
                  <rect x="37" y="68" width="3"  height="10" rx="0.5" fill="var(--ink)" fill-opacity="0.2"/>
                  <rect x="41" y="68" width="1.5" height="10" rx="0.5" fill="var(--ink)" fill-opacity="0.14"/>
                  <rect x="43.5" y="68" width="2.5" height="10" rx="0.5" fill="var(--ink)" fill-opacity="0.18"/>
                  <rect x="47" y="68" width="1"  height="10" rx="0.5" fill="var(--ink)" fill-opacity="0.1"/>
                  <rect x="49" y="68" width="3"  height="10" rx="0.5" fill="var(--ink)" fill-opacity="0.16"/>
                </svg>
            </div>
            <input
                type="file"
                id="argCardFile"
                accept="image/*"
                hidden
            >
            <div class="arg-minimal-msg" id="argCardMsg"></div>
            <button class="arg-back-btn" data-sfx="hover" data-action="back">← back</button>
        </div>
    </div>


    <!-- ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
         SCRIPTS — config + utils first, session.js last (it starts
         everything). The ones in between only talk to each other at
         run time, so their order doesn't matter.
           config.js      shared settings (API address, globe, scan)
           utils.js       small shared helpers + the 3D card model
           data.js        what the scan "finds" about the visitor
           three-loader   3D library as window.THREE (a module, so it runs
                          after these — see js/three-loader.js)
           city.js        hex city intro        music.js    radio + mixtape
           globe.js       globe, pins, dots     sounds.js   UI sounds
           scan.js        the scan sequence     login.js    passphrase + SECURED
           inventory.js   inventory overlay     cardeditor.js  card editor
           arg.js         register / card login / welcome / button actions
           signal.js      signal viewer
           session.js     decides where a visitor starts
         ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ -->
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/data.js"></script>
    <script type="importmap">
        { "imports": {
            "three":         "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        } }
    </script>
    <script type="module" src="js/three-loader.js"></script>
    <script src="js/city.js"></script>
    <script src="js/music.js"></script>
    <script src="js/globe.js"></script>
    <script src="js/sounds.js"></script>
    <script src="js/scan.js"></script>
    <script src="js/login.js"></script>
    <script src="js/inventory.js"></script>
    <script src="js/cardeditor.js"></script>
    <script src="js/arg.js"></script>
    <script src="js/signal.js"></script>
    <script src="js/session.js"></script>

</body>
</html>
